<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot-SImu · 경량 로봇 실험실</title>
<style>
  :root {
    --bg: #eef0f2; --panel: #ffffff; --line: #e1e4e8; --text: #16202a; --muted: #6b7682;
    --accent: #0f766e; --accent-soft: #d8f0ec; --warn: #b45309; --danger: #dc2626;
    --scene: #efece7; --floor: #f8f6f2; --grid: #d5d0c8; --box: #c9ced6; --wall: #9aa1ab;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161b; --panel: #1b2129; --line: #2c343f; --text: #e6eaef; --muted: #94a0ad;
      --accent: #2dd4bf; --accent-soft: #123a37; --warn: #fbbf24; --danger: #f87171;
      --scene: #161b21; --floor: #232a33; --grid: #36404c; --box: #56616f; --wall: #6f7b8a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.5 "Pretendard", "Segoe UI", "Malgun Gothic", system-ui, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: .04em; }
  h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: pointer; }
  button.primary, button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  :disabled { opacity: .45; cursor: default; }

  /* 시작 화면 */
  #start { min-height: 100%; display: grid; place-items: center; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; max-width: 620px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choices button { text-align: left; padding: 14px; display: grid; gap: 4px; }
  .choices b { font-size: 16px; }
  .choices span { color: var(--muted); font-size: 12px; }
  .choices button:hover { border-color: var(--accent); }

  /* 실험실 화면 */
  #app { height: 100%; display: grid; grid-template-columns: 1fr 360px; gap: 10px; padding: 10px; }
  #app[hidden], #start[hidden] { display: none; }
  #view { position: relative; min-height: 0; min-width: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--scene); }
  #view canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  .chip { position: absolute; left: 10px; right: 10px; width: fit-content; max-width: calc(100% - 20px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; pointer-events: none; }
  #perf { top: 10px; }
  #perf.bad { color: var(--danger); border-color: var(--danger); }
  #hint { bottom: 10px; color: var(--muted); font-size: 12px; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; overflow: auto; min-height: 0; }
  aside h2:first-child { margin-top: 0; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .row > select { flex: 1; min-width: 0; }
  label.f { display: block; margin-bottom: 8px; }
  label.f span { display: flex; justify-content: space-between; }
  label.f select { width: 100%; }
  ol#stages { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 8px; }
  ol#stages li { padding: 6px 8px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 44px 1fr auto; gap: 6px; }
  ol#stages li:last-child { border-bottom: 0; }
  ol#stages b { color: var(--accent); }
  ol#stages time { color: var(--muted); font-size: 11px; white-space: nowrap; }
  #graph { width: 100%; height: 110px; display: block; border: 1px solid var(--line); border-radius: 8px; }
  ul#labs { margin: 0; padding-left: 18px; }
  ul#labs li { margin-bottom: 4px; }
  #check.bad { color: var(--danger); }
  @media (max-width: 820px) {
    html, body { height: auto; }
    #app { grid-template-columns: 1fr; height: auto; padding: 16px; }
    #view { height: 62vw; min-height: 260px; }
    .choices { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="start">
  <div class="card">
    <h1>Robot-SImu</h1>
    <p>브라우저만으로 도는 학습용 로봇 실험실입니다. 주행 로봇, 매니퓰레이터, 진자 실험을 골라 한 틱 안에서 <b>감지 → 판단 → 행동 → 적분</b>이 어떻게 이어지는지 멈추고, 한 칸씩 돌리고, 값을 바꿔 보며 확인합니다.</p>
    <h2>실행 사양 선택</h2>
    <div class="choices">
      <button data-q="low"><b>최소 사양</b><span>내장 그래픽 노트북 · 목표 15 FPS</span><span>그림자·안티앨리어싱 끔 · 해상도 1배</span></button>
      <button data-q="high"><b>최고 사양</b><span>외장 그래픽 · 목표 60 FPS</span><span>그림자·안티앨리어싱 켬 · LiDAR 광선 표시</span></button>
    </div>
    <p class="muted" id="startMsg">사양은 화면 품질만 바꿉니다. 시뮬레이션 계산은 두 사양에서 같습니다.</p>
  </div>
</div>

<div id="app" hidden>
  <section id="view" aria-label="3D 시뮬레이션 화면">
    <div class="chip num" id="perf" role="status">측정 중…</div>
    <div class="chip" id="hint"></div>
  </section>

  <aside>
    <h2>실험 선택</h2>
    <div class="row" id="expTabs" role="group" aria-label="실험 선택"></div>

    <h2>시간</h2>
    <div class="row">
      <button id="btnPlay" class="primary">일시정지</button>
      <button id="btnTick">한 틱 실행</button>
      <button id="btnReset">초기화</button>
    </div>
    <div class="row">
      <select id="dtSel" aria-label="시간 간격 DT">
        <option value="240">DT 1/240초</option><option value="120">DT 1/120초</option><option value="60" selected>DT 1/60초</option>
        <option value="30">DT 1/30초</option><option value="10">DT 1/10초</option><option value="5">DT 1/5초</option>
      </select>
      <select id="speedSel" aria-label="배속">
        <option value="0.25">0.25배속</option><option value="1" selected>1배속</option><option value="4">4배속</option>
      </select>
    </div>

    <h2>틱 내부 <span class="num" id="tickNo"></span></h2>
    <ol id="stages">
      <li><b>① 감지</b><span id="st0"></span><time id="tm0"></time></li>
      <li><b>② 판단</b><span id="st1"></span><time id="tm1"></time></li>
      <li><b>③ 행동</b><span id="st2"></span><time id="tm2"></time></li>
      <li><b>④ 적분</b><span id="st3"></span><time id="tm3"></time></li>
    </ol>

    <h2 id="graphTitle"></h2>
    <canvas id="graph" width="640" height="220" aria-label="명령값과 실제값 그래프"></canvas>

    <h2>설정</h2>
    <div id="params"></div>
    <div class="row"><span id="buttons" class="row" style="margin:0"></span><span class="muted num" id="stat"></span></div>

    <h2>해 볼 실험</h2>
    <ul id="labs"></ul>

    <h2>정보</h2>
    <div class="row"><span class="num" id="check"></span></div>
    <div class="row"><button id="btnQuality">사양 변경</button><span class="muted num" id="seedT"></span></div>
  </aside>
</div>

<script src="vendor/three/three.min.js"></script>
<script>
'use strict';
// ══════════ 공용 도구 (실험 파일 exp/*.js 가 함께 쓴다) ══════════
const $ = id => document.getElementById(id);
const G = 9.81;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
// 난수는 시드 고정: 같은 시드와 같은 조작이면 결과가 같다 (?seed=숫자)
const seed = +new URLSearchParams(location.search).get('seed') || 1;
let rs = seed;
const rnd = () => { rs = (rs + 0x6D2B79F5) | 0; let t = Math.imul(rs ^ (rs >>> 15), 1 | rs); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const gauss = () => Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(2 * Math.PI * rnd());
// dv/dt = (F0 − k·v) / m 을 dt 만큼 적분. 명시적: 지금 v로 기울기 계산. 암시적: 다음 v로 계산(식을 풀어 쓴 형태)
const integ = (v, F0, k, m, dt, implicit) => implicit ? (v + dt * F0 / m) / (1 + dt * k / m) : v + dt * (F0 - k * v) / m;
const P = { dt: 1 / 60, speed: 1 };   // 모든 실험이 함께 쓰는 시간 설정
const keys = { v: 0, w: 0 };          // 수동 조종 입력 (-1, 0, 1)
const EXPS = [];                      // 실험 목록. 각 실험 파일이 EXPS.push({...}) 로 등록한다
const stageMs = [0, 0, 0, 0];         // 단계별 누적 시간. 실험의 step()이 단계가 끝날 때마다 mark(i)를 부른다
let tPrev = 0;
const mark = i => { const t = performance.now(); stageMs[i] += t - tPrev; tPrev = t; };
</script>
<script src="exp/rover.js"></script>
<script src="exp/arm.js"></script>
<script src="exp/pendulum.js"></script>
<script>
'use strict';
// ══════════ 실험실 본체: 고정 스텝 루프, 화면, 조작 ══════════
const QUALITY = {
  low: { name: '최소 사양', fps: 15, aa: false, pr: 1, shadow: false, rays: false },
  high: { name: '최고 사양', fps: 60, aa: true, pr: Math.min(devicePixelRatio, 2), shadow: true, rays: true },
};
const STEP_LIMIT_MS = 4;
let Q, renderer, scene, camera, sun, cur, cam;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const el = (tag, props = {}, kids = []) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };

function initView() {
  const view = $('view');
  renderer = new THREE.WebGLRenderer({ antialias: Q.aa });
  renderer.setPixelRatio(Q.pr);
  view.prepend(renderer.domElement);
  scene = new THREE.Scene(); scene.background = new THREE.Color(css('--scene'));
  camera = new THREE.PerspectiveCamera(45, 1, 0.02, 100);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb8b2a8, 1.7));
  sun = new THREE.DirectionalLight(0xffffff, 2); scene.add(sun, sun.target);
  if (Q.shadow) { renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); }

  // 카메라: 드래그 회전, 휠 확대, 짧은 클릭은 실험에 전달 (바닥 좌표)
  const cv = renderer.domElement, ray = new THREE.Raycaster(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitV = new THREE.Vector3();
  let drag = null, moved = 0;
  cv.onpointerdown = e => { drag = [e.clientX, e.clientY]; moved = 0; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => {
    if (!drag) return;
    const dx = e.clientX - drag[0], dy = e.clientY - drag[1]; drag = [e.clientX, e.clientY]; moved += Math.abs(dx) + Math.abs(dy);
    cam.az -= dx * 0.006; cam.el = clamp(cam.el + dy * 0.006, 0.05, 1.55);
  };
  cv.onpointerup = e => {
    if (drag && moved < 5 && cur.click) {
      const r = cv.getBoundingClientRect();
      ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera);
      if (ray.ray.intersectPlane(ground, hitV)) cur.click(hitV.x, hitV.z, ray);
    }
    drag = null;
  };
  cv.onwheel = e => { e.preventDefault(); cam.d = clamp(cam.d * (e.deltaY > 0 ? 1.1 : 0.9), cur.cam.d * 0.3, cur.cam.d * 3); };
  new ResizeObserver(() => { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }).observe(view);
}
// 실험이 물체를 만들 때 쓰는 도구. 만든 물체는 그 실험의 그룹(kit.g)에 들어간다
const kit = {
  css, col: n => new THREE.Color(css(n)), g: null, get Q() { return Q; },
  mesh(geo, color, x, y, z, parent = kit.g) { const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color })); m.position.set(x, y, z); m.castShadow = m.receiveShadow = Q.shadow; parent.add(m); return m; },
  flat(geo, color, opacity = 1) { const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, side: THREE.DoubleSide })); m.rotation.x = -Math.PI / 2; kit.g.add(m); return m; },
  lineSeg(arr, color, opacity = 1) { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(arr), 3)); const l = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity })); l.frustumCulled = false; kit.g.add(l); return l; },
};

function resetExp(e) { rs = seed; e.t = 0; e.tick = 0; e.hist = []; e.reset(); }
function use(e) {   // 실험 전환: 화면 그룹, 카메라, 조명, 설정 패널을 그 실험 것으로 바꾼다
  if (cur) cur.group.visible = false;
  cur = e; e.group.visible = true; cam = { ...e.cam };
  const [x, y, z] = e.cam.t, d = e.cam.d;
  sun.target.position.set(x, y, z); sun.position.set(x + d * 0.3, y + d * 0.9, z - d * 0.4);
  Object.assign(sun.shadow.camera, { left: -d * 0.6, right: d * 0.6, top: d * 0.6, bottom: -d * 0.6, near: 0.1, far: d * 3 }); sun.shadow.camera.updateProjectionMatrix();
  for (const b of $('expTabs').children) b.setAttribute('aria-pressed', b.dataset.id === e.id);
  $('hint').textContent = e.hint; $('graphTitle').textContent = e.graph.title;
  $('labs').innerHTML = e.labs.map(s => `<li>${s}</li>`).join('');   // 실험 파일에 적힌 고정 문구
  const refresh = [];   // 다른 설정에 따라 켜지고 꺼지는 입력
  $('params').replaceChildren(...e.params.map(d => {
    const out = el('b', { className: 'num' }), input = d.options
      ? el('select', {}, d.options.map(([v, t]) => el('option', { value: v, textContent: t })))
      : el('input', { type: 'range', min: d.min, max: d.max, step: d.step });
    input.value = e.p[d.key];
    const sync = () => { e.p[d.key] = +input.value; if (d.fmt) out.textContent = d.fmt(e.p[d.key]); refresh.forEach(f => f()); };
    input.oninput = sync;
    if (d.when) refresh.push(() => input.disabled = !d.when(e.p));
    if (d.fmt) out.textContent = d.fmt(e.p[d.key]);
    return el('label', { className: 'f' }, [el('span', {}, [d.label, out]), input]);
  }));
  refresh.forEach(f => f());
  $('buttons').replaceChildren(...(e.buttons || []).map(b => el('button', { textContent: b.label, onclick: () => { b.run(); hud(); } })));
  stageMs.fill(0); hud();
}

function draw() {
  const [x, y, z] = cur.cam.t;
  camera.position.set(x + cam.d * Math.cos(cam.el) * Math.sin(cam.az), y + cam.d * Math.sin(cam.el), z + cam.d * Math.cos(cam.el) * Math.cos(cam.az));
  camera.lookAt(x, y, z);
  cur.draw();
  renderer.render(scene, camera);
}

const gctx = $('graph').getContext('2d');
function drawGraph() {   // 최근 360틱의 명령값(회색)과 실제값(색)
  const w = 640, h = 220, g = cur.graph, yOf = v => h - 14 - (clamp(v, g.min, g.max) - g.min) / (g.max - g.min) * (h - 28), n = cur.hist.length / 2;
  gctx.clearRect(0, 0, w, h);
  gctx.strokeStyle = css('--line'); gctx.lineWidth = 1; gctx.fillStyle = css('--muted'); gctx.font = '20px system-ui';
  for (const [v, text] of g.marks) { gctx.beginPath(); gctx.moveTo(0, yOf(v)); gctx.lineTo(w, yOf(v)); gctx.stroke(); gctx.fillText(text, 6, yOf(v) - 6); }
  for (const [off, color, lw] of [[0, css('--muted'), 2], [1, css('--accent'), 3]]) {
    gctx.strokeStyle = color; gctx.lineWidth = lw; gctx.beginPath();
    for (let i = 0; i < n; i++) { const x = (360 - n + i) / 359 * w, y = yOf(cur.hist[2 * i + off]); i ? gctx.lineTo(x, y) : gctx.moveTo(x, y); }
    gctx.stroke();
  }
}

const perf = { frames: 0, t: 0, n: 0, sum: 0, max: 0, fps: 0, avg: 0, peak: 0 };   // 최근 0.5초 창의 측정값
function hud() {
  $('tickNo').textContent = `#${cur.tick} · t ${cur.t.toFixed(2)}초 · dt ${(P.dt * 1000).toFixed(1)} ms`;
  cur.stages().forEach((s, i) => $('st' + i).textContent = s);
  $('stat').textContent = cur.stat();
  drawGraph();
}
function perfHud() {
  const bad = perf.fps < Q.fps * 0.95 || perf.peak > STEP_LIMIT_MS;
  $('perf').textContent = `${Q.name} · ${perf.fps.toFixed(0)} FPS (목표 ${Q.fps}) · step 평균 ${perf.avg.toFixed(3)} ms · 최대 ${perf.peak.toFixed(2)} ms (한계 ${STEP_LIMIT_MS})`;
  $('perf').className = 'chip num' + (bad ? ' bad' : '');
  stageMs.forEach((ms, i) => { $('tm' + i).textContent = perf.n ? `${(ms / perf.n * 1000).toFixed(0)} µs` : ''; stageMs[i] = 0; });
}

let paused = false, last = 0, acc = 0, hudT = 0;
function tick() {   // 한 틱 = 실험의 step(dt) 한 번. 걸린 시간을 잰다
  const e = cur, t0 = tPrev = performance.now();
  e.step(P.dt);
  const ms = performance.now() - t0;
  e.t += P.dt; e.tick++;
  e.hist.push(...e.sample()); if (e.hist.length > 720) e.hist.splice(0, 2);
  perf.n++; perf.sum += ms; if (ms > perf.max) perf.max = ms;
  return ms;
}
function frame(now) {
  requestAnimationFrame(frame);
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  if (!paused) {
    acc += real * P.speed;
    let n = 0; while (acc >= P.dt && n++ < 500) { tick(); acc -= P.dt; }   // 고정 스텝: 화면 속도와 무관하게 항상 같은 dt
    if (n > 500) acc = 0;
  }
  draw();
  perf.frames++;
  if ((hudT += real) >= 0.1) { hudT = 0; hud(); }
  if (now - perf.t >= 500) {
    perf.fps = perf.frames * 1000 / (now - perf.t); perf.avg = perf.n ? perf.sum / perf.n : 0; perf.peak = perf.max;
    perfHud(); perf.frames = perf.n = perf.sum = perf.max = 0; perf.t = now;
  }
}

function setPaused(v) { paused = v; $('btnPlay').textContent = v ? '재생' : '일시정지'; }
function bindUi() {
  $('expTabs').replaceChildren(...EXPS.map(e => el('button', { textContent: e.name, onclick: () => use(e) })));
  EXPS.forEach((e, i) => $('expTabs').children[i].dataset.id = e.id);
  $('btnPlay').onclick = () => setPaused(!paused);
  $('btnTick').onclick = () => { setPaused(true); tick(); hud(); };
  $('btnReset').onclick = () => { resetExp(cur); acc = 0; hud(); };
  $('btnQuality').onclick = () => location.assign(location.pathname);
  $('dtSel').onchange = e => P.dt = 1 / +e.target.value;
  $('speedSel').onchange = e => P.speed = +e.target.value;
  const down = new Set(), upd = () => {
    keys.v = (down.has('w') || down.has('arrowup') ? 1 : 0) - (down.has('s') || down.has('arrowdown') ? 1 : 0);
    keys.w = (down.has('d') || down.has('arrowright') ? 1 : 0) - (down.has('a') || down.has('arrowleft') ? 1 : 0);
  };
  addEventListener('keydown', e => { if (/INPUT|SELECT/.test(e.target.tagName)) return; down.add(e.key.toLowerCase()); upd(); if (e.key.startsWith('Arrow')) e.preventDefault(); });
  addEventListener('keyup', e => { down.delete(e.key.toLowerCase()); upd(); });
  addEventListener('blur', () => { down.clear(); upd(); });
}

function start(q) {
  Q = QUALITY[q];
  try { initView(); } catch (e) { $('startMsg').textContent = `3D 화면을 만들 수 없습니다 (WebGL 필요): ${e.message}`; return; }
  $('start').hidden = true; $('app').hidden = false;
  for (const e of EXPS) {
    e.p = Object.fromEntries(e.params.map(d => [d.key, d.value]));
    e.group = kit.g = new THREE.Group(); e.group.visible = false; scene.add(e.group);
    e.init(kit); resetExp(e);
  }
  bindUi();
  const failed = EXPS.filter(e => !e.test()).map(e => e.name);
  console.assert(!failed.length, 'self-test failed', failed);
  $('check').textContent = failed.length ? `자체 점검 실패: ${failed.join(', ')}` : `자체 점검 통과: 실험 ${EXPS.length}개`; $('check').className = 'num' + (failed.length ? ' bad' : '');
  $('seedT').textContent = `시드 ${seed}`;
  use(EXPS.find(e => e.id === new URLSearchParams(location.search).get('exp')) || EXPS[0]);   // ?exp=arm 처럼 바로 열기
  last = perf.t = performance.now(); requestAnimationFrame(frame);
}

window.sim = {   // 콘솔·시험용: sim.use('arm'); sim.run(1000)
  get e() { return cur; }, P, EXPS, tick, use: id => use(EXPS.find(e => e.id === id)), reset: () => resetExp(cur),
  run(n) { let max = 0, sum = 0; for (let i = 0; i < n; i++) { const ms = tick(); sum += ms; if (ms > max) max = ms; } return { avg: sum / n, max }; },
};
$('start').onclick = e => { const b = e.target.closest('button[data-q]'); if (b) start(b.dataset.q); };
const q0 = new URLSearchParams(location.search).get('q');   // ?q=low|high 로 시작 화면 건너뛰기 (측정용)
if (QUALITY[q0]) start(q0);
</script>
</body>
